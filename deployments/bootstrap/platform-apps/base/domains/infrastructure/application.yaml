# File: deployments/bootstrap/platform-apps/base/domains/infrastructure/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-root
  namespace: argocd
  annotations:
    # Needs to be deployed only if argocd-self is deployed and is healthy
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Dependency on argocd-self being healthy
    dependencies.argocd.io/argocd-self: "true"
spec:
  project: infrastructure
  sources:
    - repoURL: https://github.com/pnow-devsupreme/argo.git
      targetRevision: HEAD
      path: deployments/domains/infrastructure/platform/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
