# File: deployments/bootstrap/platform-apps/base/domains/workloads/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-root
  namespace: argocd
  # !TODO: uncomment finalizers in production
  # finalizers:
    # - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/pnow-devsupreme/argo.git
      targetRevision: main
      path: deployments/domains/workloads/platform/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
