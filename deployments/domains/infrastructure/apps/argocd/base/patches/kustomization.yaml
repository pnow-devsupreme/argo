apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources: []
patches:
  - path: argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
      namespace: argocd
  
  - path: argocd-server-deployment-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
      namespace: argocd