apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
      - name: argocd-server
        volumeMounts:
        - name: tls-certs
          mountPath: /app/config/tls
      volumes:
      - name: tls-certs
        secret:
          secretName: argocd-server-tls