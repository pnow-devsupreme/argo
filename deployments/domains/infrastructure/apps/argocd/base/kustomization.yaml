apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
metadata:
  name: argocd-config
resources:
  - ingress.yaml
  - clusterissuer.yaml
  - certificate.yaml
patches:
- path: patches/argocd-cmd-params-cm-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
    namespace: argocd

- path: patches/argocd-server-deployment-patch.yaml
  target:
    kind: Deployment
    name: argocd-server
    namespace: argocd